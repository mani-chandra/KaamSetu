<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b10" />
    <title>Offline — KaamSetu</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #070b10;
        color: #f8fafc;
        padding: 1.5rem;
      }
      .glow-a {
        position: fixed;
        top: 0;
        left: -25%;
        width: 55vw;
        height: 50vh;
        border-radius: 9999px;
        background: rgba(20, 184, 166, 0.12);
        filter: blur(80px);
        pointer-events: none;
      }
      .glow-b {
        position: fixed;
        bottom: 0;
        right: -25%;
        width: 45vw;
        height: 40vh;
        border-radius: 9999px;
        background: rgba(251, 191, 36, 0.1);
        filter: blur(80px);
        pointer-events: none;
      }
      .card {
        position: relative;
        max-width: 28rem;
        text-align: center;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.35);
        display: grid;
        place-items: center;
        font-size: 1.75rem;
      }
      .brand {
        font-family: ui-monospace, monospace;
        font-size: 0.625rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }
      h1 {
        margin-top: 0.75rem;
        font-size: 1.75rem;
        font-weight: 600;
        line-height: 1.2;
      }
      p {
        margin-top: 0.75rem;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.55);
      }
      ul {
        margin-top: 1.5rem;
        text-align: left;
        list-style: none;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.45);
      }
      li {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      li span {
        color: #2dd4bf;
      }
      button {
        margin-top: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(13, 148, 136, 0.85);
        color: white;
        border-radius: 9999px;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: rgba(20, 184, 166, 0.95);
      }
    </style>
  </head>
  <body>
    <div class="glow-a" aria-hidden="true"></div>
    <div class="glow-b" aria-hidden="true"></div>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <p class="brand">KaamSetu</p>
      <h1>No internet connection</h1>
      <p>KaamSetu needs a connection to browse services and book professionals. Check your Wi‑Fi or mobile data and try again.</p>
      <ul>
        <li><span>·</span> Saved pages may not load until you are back online</li>
        <li><span>·</span> Your bookings are safe once they were confirmed</li>
      </ul>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
